# vim:set ft=tmux:

# --> Catppuccin (ANSI)
set -ogq @thm_bg "terminal"
set -ogq @thm_fg "terminal"

# Colors
set -ogq @thm_rosewater "colour0"
set -ogq @thm_flamingo "colour1"
set -ogq @thm_pink "colour2"
set -ogq @thm_mauve "colour3"
set -ogq @thm_red "colour4"
set -ogq @thm_maroon "colour5"
set -ogq @thm_peach "colour6"
set -ogq @thm_yellow "colour7"
set -ogq @thm_green "colour8"
set -ogq @thm_teal "colour9"
set -ogq @thm_sky "colour10"
set -ogq @thm_sapphire "colour11"
set -ogq @thm_blue "colour12"
set -ogq @thm_lavender "colour13"

# Surfaces and overlays
# These 2 `@thm_subtext_#` colors in all the other themes are reversed from their
# `order` in the Catppuccin palette, and it looks more correct reversed here, so follow
# the lead of the other themes and keep them reversed:
set -ogq @thm_subtext_1 "colour16"
set -ogq @thm_subtext_0 "colour15"
set -ogq @thm_overlay_2 "colour17"
set -ogq @thm_overlay_1 "colour18"
set -ogq @thm_overlay_0 "colour19"
set -ogq @thm_surface_2 "colour20"
set -ogq @thm_surface_1 "colour21"
set -ogq @thm_surface_0 "colour0"
set -ogq @thm_mantle "colour24"
set -ogq @thm_crust "colour25"
